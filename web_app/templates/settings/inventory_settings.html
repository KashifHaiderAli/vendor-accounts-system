{% extends "base.html" %}
{% block content %}
<section class="page-header">
    <div>
        <span class="soft-badge">Settings</span>
        <h2>Inventory Settings</h2>
        <p>Quantity-only stock tracking for product items. Services never affect stock.</p>
    </div>
</section>

<form class="app-card" method="post">
    {% csrf_token %}
    <div class="app-card-body">
        <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" id="enable_inventory_tracking" name="enable_inventory_tracking" {% if enable_inventory_tracking %}checked{% endif %}>
            <label class="form-check-label" for="enable_inventory_tracking">Enable Inventory Tracking</label>
        </div>
        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label">Stock Reduce On</label>
                <select class="form-select" name="stock_reduce_on">
                    <option value="delivery_challan" {% if stock_reduce_on == "delivery_challan" %}selected{% endif %}>Delivery Challan</option>
                    <option value="sales_invoice" {% if stock_reduce_on == "sales_invoice" %}selected{% endif %}>Sales Invoice</option>
                </select>
                <div class="form-text">Direct invoices without DC always reduce stock. Invoices from DC never reduce stock twice.</div>
            </div>
        </div>
    </div>
    <div class="app-card-body border-top form-actions">
        <button class="btn btn-primary" type="submit">Save Settings</button>
    </div>
</form>
{% endblock %}
