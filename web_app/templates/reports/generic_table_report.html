{% extends "base.html" %}

{% block content %}
<section class="page-header">
    <div>
        <span class="soft-badge">Reports</span>
        <h2>{{ report_title }}</h2>
        <p>Use filters, print, or export this branch-aware report.</p>
    </div>
    <div class="page-header-actions">
        <a class="btn btn-light" href="{% url 'reports:index' %}"><i class="bi bi-arrow-left"></i> Reports</a>
        <a class="btn btn-light" href="?{{ request.GET.urlencode }}{% if request.GET.urlencode %}&{% endif %}export=csv"><i class="bi bi-filetype-csv"></i> CSV</a>
        <a class="btn btn-primary" target="_blank" href="?{{ request.GET.urlencode }}{% if request.GET.urlencode %}&{% endif %}print=1"><i class="bi bi-printer"></i> Print / PDF</a>
    </div>
</section>

<form class="app-card report-filter-card mb-3" method="get">
    <div class="app-card-body">
        <div class="form-grid four-col">
            <div>
                <label class="form-label" for="branch_id">Branch</label>
                <select class="form-select" id="branch_id" name="branch_id">
                    {% for branch in allowed_branches %}
                    <option value="{{ branch.id }}" {% if filters.branch_id == branch.id|stringformat:"s" %}selected{% endif %}>{{ branch.branch_name }}</option>
                    {% empty %}
                    <option value="{{ filters.branch_id }}">Current Branch</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="form-label" for="date_from">Date From</label>
                <input class="form-control" type="date" id="date_from" name="date_from" value="{{ filters.date_from }}">
            </div>
            <div>
                <label class="form-label" for="date_to">Date To</label>
                <input class="form-control" type="date" id="date_to" name="date_to" value="{{ filters.date_to }}">
            </div>
            <div>
                <label class="form-label" for="q">Search</label>
                <input class="form-control" id="q" name="q" value="{{ filters.q }}" placeholder="Search report">
            </div>
            <div>
                <label class="form-label" for="status">Status</label>
                <input class="form-control" id="status" name="status" value="{{ filters.status }}" placeholder="Any">
            </div>
            <div>
                <label class="form-label" for="customer_id">Customer</label>
                <select class="form-select" id="customer_id" name="customer_id">
                    <option value="">All / Select</option>
                    {% for customer in filters.customers %}
                    <option value="{{ customer.id }}" {% if filters.customer_id == customer.id|stringformat:"s" %}selected{% endif %}>{{ customer.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="form-label" for="supplier_id">Supplier</label>
                <select class="form-select" id="supplier_id" name="supplier_id">
                    <option value="">All / Select</option>
                    {% for supplier in filters.suppliers %}
                    <option value="{{ supplier.id }}" {% if filters.supplier_id == supplier.id|stringformat:"s" %}selected{% endif %}>{{ supplier.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="form-label" for="account_id">Account</label>
                <select class="form-select" id="account_id" name="account_id">
                    <option value="">All / Select</option>
                    {% for account in filters.accounts %}
                    <option value="{{ account.id }}" {% if filters.account_id == account.id|stringformat:"s" %}selected{% endif %}>{{ account.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="form-label" for="cash_bank_account_id">Cash / Bank</label>
                <select class="form-select" id="cash_bank_account_id" name="cash_bank_account_id">
                    <option value="">All / Select</option>
                    {% for account in filters.cash_bank_accounts %}
                    <option value="{{ account.id }}" {% if filters.cash_bank_account_id == account.id|stringformat:"s" %}selected{% endif %}>{{ account.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="form-actions">
            <a class="btn btn-light" href="{{ request.path }}">Reset</a>
            <button class="btn btn-primary" type="submit"><i class="bi bi-funnel"></i> Apply Filters</button>
        </div>
    </div>
</form>

{% include "reports/report_base.html" %}
{% endblock %}
