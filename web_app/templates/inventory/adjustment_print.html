<!doctype html><html><head><meta charset="utf-8"><title>{{ adjustment.adjustment_no }}</title></head><body><button onclick="print()">Print</button><h1>Stock Adjustment</h1><p>{{ adjustment.adjustment_no }} · {{ adjustment.adjustment_date }} · {{ adjustment.adjustment_type }}</p><table border="1" cellspacing="0" cellpadding="4" width="100%"><tr><th>Item</th><th>Qty</th><th>Unit Cost</th><th>Remarks</th></tr>{% for row in items %}<tr><td>{{ row.item_name }}</td><td align="right">{{ row.quantity|format_quantity }}</td><td align="right">{{ row.unit_cost|floatformat:2 }}</td><td>{{ row.remarks }}</td></tr>{% endfor %}</table></body></html>
