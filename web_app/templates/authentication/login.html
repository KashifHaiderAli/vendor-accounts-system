{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | {{ system_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-panel">
            <div class="login-brand">
                <div class="brand-mark">CS</div>
                <div>
                    <h1>{{ system_name }}</h1>
                    <p>{{ current_company_name }}</p>
                </div>
            </div>

            <form class="login-form" method="post" action="#">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label" for="username">Username</label>
                    <input class="form-control" id="username" name="username" type="text" placeholder="admin" disabled>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-control" id="password" name="password" type="password" placeholder="Password" disabled>
                </div>
                <button class="btn btn-primary w-100" type="button" disabled>Login available in Phase 3</button>
            </form>
        </section>
    </main>
</body>
</html>
