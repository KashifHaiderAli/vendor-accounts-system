<div class="totals-box">
    <div class="row"><span>Subtotal</span><strong>{{ subtotal|format_amount }}</strong></div>
    {% if discount_total %}<div class="row"><span>Discount</span><strong>{{ discount_total|format_amount }}</strong></div>{% endif %}
    {% if tax_enabled %}
    <div class="row"><span>Tax Total</span><strong>{{ tax_total|format_amount }}</strong></div>
    {% endif %}
    <div class="row"><span>Grand Total</span><strong>{{ grand_total|format_amount }}</strong></div>
</div>
