{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | {{ system_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-panel">
            <div class="login-brand">
                <div class="brand-mark">CS</div>
                <div>
                    <h1>{{ system_name }}</h1>
                    <p>Use the credentials created by DB App.</p>
                </div>
            </div>

            {% include "partials/messages.html" %}

            <form class="login-form" method="post" action="">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label" for="username">Username</label>
                    <div class="input-icon-field">
                        <i class="bi bi-person"></i>
                        <input class="form-control" id="username" name="username" type="text" value="{{ username|default:'' }}" placeholder="Enter username" autocomplete="username" required autofocus>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-icon-field">
                        <i class="bi bi-shield-lock"></i>
                        <input class="form-control" id="password" name="password" type="password" placeholder="Enter password" autocomplete="current-password" required>
                    </div>
                </div>
                <button class="btn btn-primary w-100 login-submit" type="submit">
                    <i class="bi bi-box-arrow-in-right"></i>
                    Login
                </button>
            </form>
        </section>
    </main>
</body>
</html>
