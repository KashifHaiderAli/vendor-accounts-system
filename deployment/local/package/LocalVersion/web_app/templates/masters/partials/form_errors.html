{% if error_summary or warnings %}
<div class="app-card-body pb-0">
  {% if error_summary %}
  <div class="alert alert-danger app-alert mb-3" role="alert">
    <strong>Please fix the following:</strong>
    <ul class="mb-0 mt-2">
      {% for error in error_summary %}
      <li>{{ error }}</li>
      {% endfor %}
    </ul>
  </div>
  {% endif %}
  {% if warnings %}
  <div class="alert alert-warning app-alert mb-3" role="alert">
    <strong>Note:</strong>
    <ul class="mb-0 mt-2">
      {% for warning in warnings %}
      <li>{{ warning }}</li>
      {% endfor %}
    </ul>
  </div>
  {% endif %}
</div>
{% endif %}
